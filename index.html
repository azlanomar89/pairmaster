<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-HZ2fazCJeN3LhOn7PyYOUc1qlSXpJgABxl+s8h5PgCg='; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>PairMaster</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dedcd5;
  --accent: #1f6f5c; --accent-ink: #ffffff; --accent-soft: #e3f0ec; --warn: #a24b0b; --warn-soft: #fbeedd;
  --win: #1f6f5c; --loss: #9b2c2c; --row: #faf9f6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181a; --panel: #212226; --ink: #ececee; --muted: #9a9aa2; --line: #36373c;
    --accent: #5cc2a5; --accent-ink: #0d1f1a; --accent-soft: #1e3530; --warn: #f0a35e; --warn-soft: #3a2a1a;
    --win: #5cc2a5; --loss: #f08a8a; --row: #1c1d20;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--loss); }
button.small { padding: 2px 8px; font-size: 13px; }
button:disabled { opacity: .45; cursor: default; }
input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .2px; color: var(--accent); }
.event { color: var(--muted); }
.spacer { flex: 1; }
.saved { color: var(--muted); font-size: 13px; }
.version { color: var(--muted); font-weight: 400; font-size: 12px; }
.help { color: var(--accent); font-size: 14px; text-decoration: none; }
.help:hover { text-decoration: underline; }
.banner { background: var(--warn-soft); color: var(--warn); padding: 8px 16px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; padding: 10px 16px 0; flex-wrap: wrap; }
.tabs button { border-radius: 8px 8px 0 0; border-bottom: none; }
.tabs button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sections { display: flex; gap: 6px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; align-items: center; }
.sections .chip { border-radius: 999px; }
.sections .chip.active { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
main { padding: 16px; max-width: 1100px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; overflow-x: auto; }  /* wide tables scroll inside the card on small screens */
.card h2 { margin: 0 0 10px; font-size: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.row label { color: var(--muted); font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:nth-child(even) td { background: var(--row); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.score { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.name-input { width: 100%; min-width: 180px; }
.starter { color: var(--accent); font-weight: 700; width: 14px; display: inline-block; }
.win { color: var(--win); font-weight: 600; }
.loss { color: var(--loss); }
.result { font-size: 13px; color: var(--muted); white-space: nowrap; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); font-size: 12px; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.missing td { opacity: .55; }
.actions { white-space: nowrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
#print-area { display: none; }
@media print {
  .no-print, main { display: none !important; }
  body { background: #fff; color: #000; font-size: 12pt; }
  #print-area { display: block; }
  #print-area h1 { font-size: 18pt; margin: 0 0 4px; }
  #print-area h2 { font-size: 13pt; margin: 0 0 10px; font-weight: normal; }
  #print-area table { width: auto; }
  #print-area td, #print-area th { border-bottom: 1px solid #ccc; padding: 3px 10px; background: none !important; color: #000; }
  .page-break { page-break-before: always; }
}
.preview { background: #fff; color: #000; border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.preview h1 { font-size: 20px; margin: 0 0 4px; }
.preview h2 { font-size: 15px; margin: 0 0 10px; font-weight: normal; }
.preview table { width: auto; }
.preview td, .preview th { background: none !important; color: #000; border-bottom: 1px solid #ddd; }
details.gib { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
details.gib summary { cursor: pointer; }
details.gib .row label { color: var(--ink); font-size: 14px; }
.preview { overflow-x: auto; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.scorecard { border: 1px solid #999; border-radius: 6px; padding: 8px 10px; break-inside: avoid; page-break-inside: avoid; }
.scorecard .sc-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.scorecard .sc-sub { font-size: 11px; color: #555; margin-bottom: 4px; }
.scorecard table { width: 100%; font-size: 11px; }
.scorecard td, .scorecard th { padding: 2px 4px !important; }
table.wall { font-size: 11px; }
table.wall td, table.wall th { padding: 2px 5px !important; white-space: nowrap; border: 1px solid #bbb !important; }
table.wall td.w { font-weight: 600; }
@media print {
  .cards { gap: 8px; }
  table.wall { font-size: 8.5pt; }
}
.missing-list { margin: 8px 0; padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 1px dashed var(--line); font-size: 13px; }
button.pill { cursor: pointer; border: 0; font: inherit; }
.slips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.slip { border: 1px dashed #888; border-radius: 6px; padding: 8px 10px; break-inside: avoid; page-break-inside: avoid; font-size: 12px; }
.slip-head { margin-bottom: 4px; }
.slip table { width: 100%; }
.slip-name { width: 65%; }
.slip-box { border: 1px solid #555 !important; height: 26px; }
.slip-sign { margin-top: 8px; font-size: 11px; color: #444; }
body.board { padding: 28px 40px; font-size: 30px; }
body.board h1 { font-size: 44px; margin: 0 0 6px; }
body.board h2 { font-size: 24px; font-weight: normal; color: var(--muted); margin: 0 0 18px; }
body.board td, body.board th { padding: 6px 14px; font-size: 30px; }
body.board #board-full { position: fixed; right: 16px; bottom: 16px; font-size: 14px; }
.banner.practice { background: #f0a020; color: #1d1d1f; }
body.practicing .topbar { box-shadow: inset 0 -4px 0 #f0a020; }
.share-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.share-grid figure { margin: 0; }
.share-grid img { width: 100%; height: auto; border: 1px solid #ccd5d0; border-radius: 6px; display: block; }
.share-grid figcaption { font-size: 11px; color: #555; margin-top: 4px; word-break: break-all; }

</style>
</head>
<body>
<header class="topbar no-print">
  <div class="brand">PairMaster <span class="version">1.3</span></div>
  <div class="event" id="event-label"></div>
  <div class="spacer"></div>
  <span class="saved" id="saved-label"></span>
  <button id="btn-practice" class="small" title="Try PairMaster safely on a made-up event (a dry run). Your real tournament is not touched.">Practice</button>
  <a class="help" id="btn-help" href="guide.html" target="_blank" rel="noopener" title="User guide">Help</a>
  <button id="btn-undo" title="Undo the last change (Ctrl+Z or Cmd+Z)" disabled>↶ Undo</button>
  <button id="btn-new">New</button>
  <button id="btn-folder" class="small" hidden></button>
  <button id="btn-open" title="Open a PairMaster event file (.pairmaster) or an AuPair .TOU file">Open</button>
  <button id="btn-save" class="primary" title="Saves the .TOU file (for AuPair and ratings) and the .pairmaster event file (everything else)">Save</button>
  <input type="file" id="file-input" accept=".pairmaster,.tou,.TOU,text/plain" hidden>
</header>
<div id="banner" class="banner no-print" hidden></div>
<nav class="tabs no-print" id="tabs">
  <button data-tab="players">Players</button>
  <button data-tab="round">Rounds &amp; scores</button>
  <button data-tab="standings">Standings</button>
  <button data-tab="print">Print</button>
</nav>
<div class="sections no-print" id="section-bar"></div>
<main id="main"></main>
<div id="print-area"></div>
<script>
// PairMaster — tournament data model, results and standings.
// Data shapes:
//   Tournament { date:'DD.MM.YYYY', title, rankMethod:'M'|'A', sections:[Section] }
//   Section    { name, highWord:{text, score}, players:[Player] }
//   Player     { name, missing:boolean, games:[Game], school?:string }   // games[round-1]; school is not in .TOU files
//   Game       { opp:index (own index => nongame), score, first:boolean, nongame:null|'W'|'L'|'D' }
var PM = (typeof PM !== 'undefined') ? PM : {};

(function (PM) {
  'use strict';

  PM.MIN_SCORE = 10; // touprint treats a score under 10 as "not entered yet"

  PM.newTournament = function (date, title, rankMethod) {
    return { date: date || '', title: title || '', rankMethod: rankMethod === 'A' ? 'A' : 'M', sections: [] };
  };

  PM.addSection = function (t, name) {
    var s = { name: name, highWord: { text: '', score: 0 }, players: [] };
    t.sections.push(s);
    return s;
  };

  PM.addPlayer = function (sec, name) {
    var drawn = PM.roundsDrawn ? PM.roundsDrawn(sec) : 0;
    var p = { name: name, missing: false, games: [] };
    sec.players.push(p);
    var idx = sec.players.length - 1;
    for (var r = 0; r < drawn; r++) p.games[r] = { opp: idx, score: 0, first: false, nongame: 'L' };
    return p;
  };

  PM.displayName = function (name) {
    return String(name).replace(/@\S+/g, '').replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
  };

  PM.game = function (sec, p, round) {
    return sec.players[p] ? sec.players[p].games[round - 1] || null : null;
  };

  // Put players a and b against each other in a round. aFirst: a starts.
  PM.pairGame = function (sec, round, a, b, aFirst) {
    sec.players[a].games[round - 1] = { opp: b, score: 0, first: !!aFirst, nongame: null };
    sec.players[b].games[round - 1] = { opp: a, score: 0, first: !aFirst, nongame: null };
  };

  PM.setScore = function (sec, round, p, score) {
    var g = PM.game(sec, p, round);
    if (!g) throw new Error('No game drawn for this player in round ' + round);
    if (g.opp === p) throw new Error('This is a nongame (bye/designated result) - it has no score');
    g.score = Math.max(0, Math.min(999, Math.round(Number(score) || 0)));
  };

  // Designated win/loss/draw (also used for byes). As in AuPair, an existing opponent is
  // left without an opponent and without a result (written "-N", N = players + 1) until
  // the tournament director re-pairs them or gives them a result. Nothing is awarded automatically.
  PM.setNongame = function (sec, round, p, kind) {
    var g = PM.game(sec, p, round);
    if (g && g.opp !== p) {
      var q = g.opp, og = sec.players[q].games[round - 1];
      sec.players[q].games[round - 1] = {
        opp: q, score: og.score, first: false, nongame: null,
        rawOpp: (og.first ? '+' : '') + '-' + (sec.players.length + 1)
      };
    }
    sec.players[p].games[round - 1] = { opp: p, score: kind === 'D' ? 350 : 0, first: false, nongame: kind };
  };

  PM.isPlayed = function (sec, p, round) {
    var g = PM.game(sec, p, round);
    if (!g || g.opp === p) return false;
    var og = PM.game(sec, g.opp, round);
    return g.score >= PM.MIN_SCORE && !!og && og.score >= PM.MIN_SCORE;
  };

  // Result of one round for one player, or null if nothing to count yet. t (optional) gives the tournament's
  // scoring settings: byeSpread (default 1) and spreadCap (maximum spread per game, standings only).
  // A forfeit, or a forfeit code read from a .TOU, carries its own margin (g.margin).
  PM.gameResult = function (sec, p, round, t) {
    var g = PM.game(sec, p, round);
    if (!g) return null;
    if (g.opp === p) {
      if (g.rawOpp) return null; // AuPair left this player without an opponent: needs a pairing
      var k = g.nongame || 'D';
      var bye = t && Number.isInteger(t.byeSpread) ? t.byeSpread : 1;
      return {
        win: k === 'W' ? 1 : k === 'D' ? 0.5 : 0,
        spread: g.margin !== undefined && k !== 'D' ? (k === 'W' ? g.margin : -g.margin) : k === 'W' ? bye : 0,
        forfeit: !!g.forfeit,
        score: k === 'D' ? g.score : 0, // notional half-game score (AuPair uses 350), counted in total score
        played: false, nongame: true, kind: k
      };
    }
    if (!PM.isPlayed(sec, p, round)) return null;
    var os = PM.game(sec, g.opp, round).score, d = g.score - os;
    if (t && Number.isInteger(t.spreadCap) && t.spreadCap > 0) d = Math.max(-t.spreadCap, Math.min(t.spreadCap, d));
    return {
      win: g.score > os ? 1 : g.score === os ? 0.5 : 0,
      spread: d, score: g.score, played: true, nongame: false
    };
  };

  // Player p forfeits round r (WESPA Rule 2.3.6, e.g. lateness): the opponent wins by the tournament's
  // forfeit margin (default 100), p loses by it. Neither counts for ratings; both are recorded at once.
  PM.setForfeit = function (t, sec, round, p) {
    var g = PM.game(sec, p, round);
    if (!g || g.opp === p) throw new Error('A forfeit needs a paired game.');
    var q = g.opp, m = t && Number.isInteger(t.forfeitMargin) && t.forfeitMargin >= 0 ? t.forfeitMargin : 100;
    sec.players[q].games[round - 1] = { opp: q, score: 0, first: false, nongame: 'W', forfeit: true, margin: m };
    sec.players[p].games[round - 1] = { opp: p, score: 0, first: false, nongame: 'L', forfeit: true, margin: m };
  };

  PM.roundsDrawn = function (sec) {
    var n = 0;
    sec.players.forEach(function (pl) { if (pl.games.length > n) n = pl.games.length; });
    return n;
  };

  PM.isRoundComplete = function (sec, round) {
    if (!sec.players.length) return false;
    for (var p = 0; p < sec.players.length; p++) {
      if (!PM.gameResult(sec, p, round)) return false;
    }
    return true;
  };

  PM.roundsComplete = function (sec) {
    var r = 0, drawn = PM.roundsDrawn(sec);
    while (r < drawn && PM.isRoundComplete(sec, r + 1)) r++;
    return r;
  };

  PM.missingResults = function (sec, round) {
    var out = [];
    sec.players.forEach(function (pl, p) {
      var g = pl.games[round - 1];
      if (!g) { out.push(p); return; }
      if (g.rawOpp || (g.opp !== p && g.score < PM.MIN_SCORE)) out.push(p);
    });
    return out;
  };

  // fromRound (optional, default 1): count only rounds fromRound..upToRound, e.g. for "best of day 2" prizes.
  PM.standings = function (t, sec, upToRound, fromRound) {
    if (upToRound === undefined || upToRound === null) upToRound = PM.roundsComplete(sec);
    var rows = sec.players.map(function (pl, p) {
      var r = { idx: p, wins: 0, losses: 0, spread: 0, total: 0, byes: 0, byeWins: 0, byeSpread: 0, games: 0, firsts: 0, seconds: 0 };
      for (var round = Math.max(1, fromRound || 1); round <= upToRound; round++) {
        var res = PM.gameResult(sec, p, round, t);
        if (!res) continue;
        r.wins += res.win; r.losses += 1 - res.win; r.spread += res.spread; r.total += res.score;
        if (res.nongame) { r.byes++; r.byeWins += res.win; r.byeSpread += res.spread; }
        else { r.games++; if (PM.game(sec, p, round).first) r.firsts++; else r.seconds++; }
      }
      return r;
    });
    var key = t.rankMethod === 'A' ? 'total' : 'spread';
    rows.sort(function (a, b) {
      return (b.wins - a.wins) || (b[key] - a[key]) || (a.idx - b.idx);
    });
    rows.forEach(function (r, i) { r.rank = i + 1; });
    return rows;
  };

  // Results of one round: games first (higher-ranked player as "a"), then byes/designated results.
  PM.roundResults = function (t, sec, round) {
    var games = [], nongames = [], seen = {};
    PM.standings(t, sec, Math.max(0, round - 1)).forEach(function (row) {
      var p = row.idx, g = PM.game(sec, p, round);
      if (!g || seen[p]) return;
      seen[p] = true;
      if (g.opp === p) {
        var ng = { a: p, b: null, aScore: 0, bScore: 0, aFirst: false, bFirst: false, outcome: 'nongame', winner: null, margin: g.margin || 0, nongame: g.rawOpp ? null : g.nongame || 'D' };
        if (g.margin !== undefined && g.nongame !== 'D') ng.forfeit = true;
        nongames.push(ng);
        return;
      }
      var og = PM.game(sec, g.opp, round);
      seen[g.opp] = true;
      var done = PM.isPlayed(sec, p, round), d = g.score - og.score;
      games.push({
        a: p, b: g.opp, aScore: g.score, bScore: og.score, aFirst: !!g.first, bFirst: !!og.first,
        outcome: !done ? 'pending' : d === 0 ? 'tie' : 'win',
        winner: done && d !== 0 ? (d > 0 ? p : g.opp) : null,
        margin: done ? Math.abs(d) : 0, nongame: null
      });
    });
    return games.concat(nongames);
  };

  PM.highGame = function (sec) {
    var best = { score: 0, names: [] };
    var drawn = PM.roundsDrawn(sec);
    sec.players.forEach(function (pl, p) {
      for (var r = 1; r <= drawn; r++) {
        if (!PM.isPlayed(sec, p, r)) continue;
        var s = pl.games[r - 1].score, nm = PM.displayName(pl.name);
        if (s > best.score) best = { score: s, names: [nm] };
        else if (s === best.score && best.names.indexOf(nm) < 0) best.names.push(nm);
      }
    });
    return best;
  };

  // newOrder[i] = old index of the player who will sit at position i.
  PM.reorderPlayers = function (sec, newOrder) {
    var map = {};
    newOrder.forEach(function (oldIdx, newIdx) { map[oldIdx] = newIdx; });
    var players = newOrder.map(function (oldIdx) { return sec.players[oldIdx]; });
    players.forEach(function (pl) {
      pl.games.forEach(function (g) { if (g) g.opp = map[g.opp]; });
    });
    sec.players = players;
    if (sec.playoff) { sec.playoff.a = map[sec.playoff.a]; sec.playoff.b = map[sec.playoff.b]; } // same two players
  };

  // Structural check for tournaments loaded from autosave: every game must point at a real
  // player whose own game that round points back (or be a game against yourself).
  PM.validTournament = function (t) {
    if (!t || typeof t !== 'object' || !Array.isArray(t.sections) || typeof t.title !== 'string' ||
        typeof t.date !== 'string' || (t.rankMethod !== 'M' && t.rankMethod !== 'A')) return false;
    var whole = function (v) { return v === undefined || Number.isInteger(v); };
    if (!whole(t.forfeitMargin) || !whole(t.byeSpread) || !whole(t.spreadCap)) return false;
    return t.sections.every(function (s) {
      if (!s || typeof s.name !== 'string' || !Array.isArray(s.players)) return false;
      // Division settings end up in the page: only plain counts, known words and text are allowed.
      // (any whole number is harmless, and earlier versions could save e.g. a negative high-word score)
      var count = function (v) { return v === undefined || Number.isInteger(v); };
      if (!count(s.totalRounds) || !count(s.prizes)) return false;
      if (s.gibsonMode !== undefined && ['off', 'first', 'decided'].indexOf(s.gibsonMode) < 0) return false;
      if (s.avoidSameSchool !== undefined && typeof s.avoidSameSchool !== 'boolean') return false;
      if (s.useClasses !== undefined && typeof s.useClasses !== 'boolean') return false;
      if (s.useRatings !== undefined && typeof s.useRatings !== 'boolean') return false;
      var po = s.playoff, nP = s.players.length;
      var idxOK = function (v) { return Number.isInteger(v) && v >= 0 && v < nP; };
      if (po !== undefined && (!po || typeof po !== 'object' || !idxOK(po.a) || !idxOK(po.b) || po.a === po.b ||
          (po.bestOf !== 3 && po.bestOf !== 5) || !Array.isArray(po.games) || po.games.length > po.bestOf ||
          !po.games.every(function (g) {
            return g === null || (g && typeof g === 'object' && Number.isInteger(g.aScore) && Number.isInteger(g.bScore) && typeof g.aFirst === 'boolean');
          }))) return false;
      if (s.gibsonMissingReturn !== undefined && typeof s.gibsonMissingReturn !== 'boolean') return false;
      if (!count(s.schoolFrom) || !count(s.schoolTo)) return false;
      var ex = s.prizeExtras;
      if (ex !== undefined && (!ex || typeof ex !== 'object' || !count(ex.from) || !count(ex.to) ||
          ['tuff', 'lucky', 'average'].some(function (k) { return ex[k] !== undefined && typeof ex[k] !== 'boolean'; }))) return false;
      if (s.highWord !== undefined && (!s.highWord || typeof s.highWord !== 'object' ||
          typeof s.highWord.text !== 'string' || !count(s.highWord.score))) return false;

  // ---------- persistence ----------

  // ---------- automatic backup: when a round finishes, save into the chosen folder without asking ----------
  var backingUp = false;
  async function autoBackup() {
    var done = totalComplete();
    if (backingUp || !canFolder || done <= (st.t.lastBackupRounds || 0)) return;
    backingUp = true;
    try {
      if (!folder) folder = await idb('get');
      // Only when the browser already allows it: asking for permission needs a click, so then the reminder stays.
      if (!folder || (await folder.queryPermission({ mode: 'readwrite' })) !== 'granted') return;
      var name = st.t.lastSavedName || PM.touFileName(st.t.title).replace(/\.TOU$/, '');
      var round = st.t.sections.reduce(function (m, s) { return Math.max(m, PM.roundsComplete(s)); }, 0);
      var tou = PM.writeTou(st.t), ev = PM.writeEvent(st.t), copies = PM.backupFileNames(name, round);
      var sub = await folder.getDirectoryHandle('PairMaster backups', { create: true });
      var files = [[name + '.TOU', tou], [name + '.pairmaster', ev]];
      for (var i = 0; i < files.length; i++) {
        var w = await (await folder.getFileHandle(files[i][0], { create: true })).createWritable(); await w.write(files[i][1]); await w.close();
      }
      var copy = [[copies[0], tou], [copies[1], ev]];
      for (var j = 0; j < copy.length; j++) {
        var w2 = await (await sub.getFileHandle(copy[j][0], { create: true })).createWritable(); await w2.write(copy[j][1]); await w2.close();
      }
      st.t.lastSavedName = name; st.t.lastBackupRounds = done;
      localStorage.setItem(STORE_KEY, JSON.stringify({ t: st.t, sec: st.sec, round: st.round, tab: st.tab }));
      renderBanner();
      flash('Round ' + round + ' finished: saved ' + name + '.TOU and a copy in "PairMaster backups" ✓');
    } catch (e) { /* the yellow reminder stays, so nothing is lost */ }
    finally { backingUp = false; }
  }
  function load() {
    try {
      var raw = localStorage.getItem(activeKey());

      if (!d || !PM.validTournament(d.t)) throw new Error('damaged');
      st.t = d.t; st.sec = d.sec || 0; st.round = d.round || 1; st.tab = d.tab || 'players';
      undoLog.reset(st.t);
      return true;
    } catch (e) {
      try { localStorage.setItem(STORE_KEY + '.damaged', localStorage.getItem(STORE_KEY)); } catch (e2) { /* ignore */ }

        'The damaged copy was kept. Open your latest .TOU file to carry on.');

  }
  // Save now, redraw a moment later: by then a Tab or click has moved the cursor to its next box, which is found
  // again in the redrawn screen, so typing carries on where the director expects (nothing typed is lost).
  var renderPending = false;
  function changed() {
    save();

    renderPending = true;
    setTimeout(function () {

  function focusKey(el) {

    for (var i = 0; i < el.attributes.length; i++) {
      var at = el.attributes[i];
      if (/^data-/.test(at.name)) return el.tagName.toLowerCase() + '[' + at.name + '="' + String(at.value).replace(/"/g, '') + '"]';

  }
  function selectionOf(el) { try { return el && typeof el.selectionStart === 'number' ? [el.selectionStart, el.selectionEnd] : null; } catch (e) { return null; } }
  function restoreFocus(key, sel) {
    if (!key) return;

  function renderUndo() {

  function freshTournament() {

  // ---------- .TOU files: saved into a chosen folder (Chrome/Edge), else downloaded ----------
  var canFolder = typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';
  var folder = null; // FileSystemDirectoryHandle, remembered in IndexedDB
  function idb(op, value) {
    return new Promise(function (resolve) {
      try {
        var rq = indexedDB.open('pairmaster', 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore('kv'); };
        rq.onerror = function () { resolve(null); };
        rq.onsuccess = function () {
          try {
            var os = rq.result.transaction('kv', op === 'get' ? 'readonly' : 'readwrite').objectStore('kv');
            var r = op === 'get' ? os.get('folder') : os.put(value, 'folder');
            r.onsuccess = function () { resolve(r.result || null); };
            r.onerror = function () { resolve(null); };
          } catch (e) { resolve(null); }
        };
      } catch (e) { resolve(null); }
    });
  }
  function renderFolder() {
    var b = $('btn-folder');

    b.title = folder ? 'Save puts your files in "' + folder.name + '". Click to choose a different folder.' : 'Choose the folder where Save puts your files';
  }
  async function chooseFolder() {
    try {

      await idb('put', folder);

    return folder;
  }
  async function usableFolder() {
    if (!folder) folder = await idb('get');
    if (!folder) return chooseFolder();
    try {
      if ((await folder.queryPermission({ mode: 'readwrite' })) === 'granted') return folder;
      if ((await folder.requestPermission({ mode: 'readwrite' })) === 'granted') return folder;
    } catch (e) { /* folder moved or deleted */ }

    folder = null;
    return chooseFolder();
  }
  function flash(msg) { $('saved-label').textContent = msg; }
  function download(text, file) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' })); a.download = file;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  async function saveTou() {
    var dir = null;
    if (canFolder) { dir = await usableFolder(); if (!dir) return; } // ask for the folder first, while the click still counts
    var name = prompt('File name for the .TOU file (8 characters at most, no spaces):', st.t.lastSavedName || PM.touFileName(st.t.title));
    if (!name) return;
    name = name.toUpperCase().replace(/\.TOU$/, '').replace(/[^A-Z0-9_-]/g, '').slice(0, 8) || 'TOURNEY';
    var file = name + '.TOU';
    // The .TOU is for AuPair and the ratings officer; the event file next to it keeps everything else.
    var files = [[file, PM.writeTou(st.t)], [name + '.pairmaster', PM.writeEvent(st.t)]];
    if (dir) {
      var exists = false;
      try { await dir.getFileHandle(file); exists = true; } catch (e) { /* new file */ }
      if (exists && name !== st.t.lastSavedName && !confirm(file + ' already exists in ' + dir.name + '. Replace it?')) return;
      if (!(await writeFiles(dir, files))) return;

        await w.write(files[i][1]); await w.close();
      }

    } catch (e) {
      alert('Could not save in ' + dir.name + ' (' + e.message + '). The files will be downloaded instead.');

      (schools ? '<input id="p-new-school" size="16" maxlength="30" placeholder="School / club">' : '') +

        '. Example: <i>Ann Lee' + (ratings ? ', 1650' : '') + (schools ? ', Hillview School' : '') + (classes ? ', Newcomer' : '') + '</i>. Columns copied from a spreadsheet can be pasted straight in.</p>' : '') +
      '<textarea id="p-bulk" rows="6" cols="40"></textarea><br><button id="p-bulk-add" class="small">Add all</button></details></div>';
    main.innerHTML = h;

    $('t-date').onchange = function () { st.t.date = isoToDmy(this.value) || st.t.date; changed(); };
    $('t-title').onchange = function () { st.t.title = this.value.trim(); changed(); };

    $('t-forfeit').onchange = function () { var n = whole(this.value, 0, 999); if (n === undefined || n === 100) delete st.t.forfeitMargin; else st.t.forfeitMargin = n; changed(); };
    $('t-bye').onchange = function () { var n = whole(this.value, 0, 999); if (n === undefined || n === 1) delete st.t.byeSpread; else st.t.byeSpread = n; changed(); };
    $('t-cap').onchange = function () { var n = whole(this.value, 1, 999); if (n === undefined) delete st.t.spreadCap; else st.t.spreadCap = n; changed(); };
    $('s-name').onchange = function () { s.name = this.value.trim().toUpperCase().slice(0, 20) || s.name; changed(); };
    $('s-sort').onclick = function () {
      var order = s.players.map(function (x, i) { return i; });
      order.sort(function (a, b) { return PM.displayName(s.players[a].name).localeCompare(PM.displayName(s.players[b].name)); });
      PM.reorderPlayers(s, order); changed();
    };
    if ($('s-del')) $('s-del').onclick = function () {
      if (!confirm('Delete division ' + s.name + ' and its players?')) return;

    };
    function addName(n, school, klass, rating) {
      n = n.replace(/\s+/g, ' ').trim();

      klass = String(klass || '').replace(/\s+/g, ' ').trim().slice(0, 20);
      if (!n) return;
      var pl = PM.addPlayer(s, n.slice(0, 20));
      if (school) pl.school = school;
      if (klass) pl.klass = klass;
      if (Number.isInteger(rating) && rating > 0) pl.rating = rating;
    }
    function ratingFrom(v) { v = String(v || '').trim(); return /^\d{1,4}$/.test(v) && +v > 0 ? +v : null; }
    $('s-school').onchange = function () { if (this.checked) s.avoidSameSchool = true; else delete s.avoidSameSchool; changed(); };
    $('s-class').onchange = function () { if (this.checked) s.useClasses = true; else delete s.useClasses; changed(); };
    function roundSetting(id, key) { if ($(id)) $(id).onchange = function () { var n = parseInt(this.value, 10); if (n > 0) s[key] = n; else delete s[key]; changed(); }; }
    roundSetting('s-sch-from', 'schoolFrom'); roundSetting('s-sch-to', 'schoolTo');
    $('s-rating').onchange = function () { if (this.checked) s.useRatings = true; else delete s.useRatings; changed(); };
    if ($('s-sort-rating')) $('s-sort-rating').onclick = function () {

      PM.sortByRating(s); changed();
    };
    $('p-add').onclick = function () { addName($('p-new').value, schools ? $('p-new-school').value : '', classes ? $('p-new-class').value : '', ratings ? ratingFrom($('p-new-rating').value) : null); changed(); $('p-new').focus(); };
    if (ratings) $('p-new-rating').onkeydown = function (e) { if (e.key === 'Enter') $('p-add').onclick(); };
    if (classes) $('p-new-class').onkeydown = function (e) { if (e.key === 'Enter') $('p-add').onclick(); };
    $('p-new').onkeydown = function (e) { if (e.key === 'Enter') $('p-add').onclick(); };
    if (schools) $('p-new-school').onkeydown = function (e) { if (e.key === 'Enter') $('p-add').onclick(); };
    $('p-bulk-add').onclick = function () {
      $('p-bulk').value.split(/\n/).forEach(function (line) {
        var x = PM.parsePlayerLine(line, { ratings: ratings, schools: schools, classes: classes });
        addName(x.name, x.school, x.klass, x.rating);
      });
      changed();
    };
    main.querySelectorAll('[data-rating]').forEach(function (inp) {
      inp.onchange = function () {
        var pl = s.players[+this.dataset.rating], r = ratingFrom(this.value);
        if (this.value.trim() && r === null) alert('A rating is a number such as 1650. Leave it empty for an unrated player.');
        if (r === null) delete pl.rating; else pl.rating = r;
        changed();
      };
    });
    main.querySelectorAll('[data-klass]').forEach(function (inp) {
      inp.onchange = function () {
        var v = this.value.replace(/\s+/g, ' ').trim().slice(0, 20), pl = s.players[+this.dataset.klass];
        if (v) pl.klass = v; else delete pl.klass;
        changed();

    });
    main.querySelectorAll('[data-school]').forEach(function (inp) {
      inp.onchange = function () {

        if (v) pl.school = v; else delete pl.school;
        changed();
      };
    });
    main.querySelectorAll('[data-name]').forEach(function (inp) {

    });
    main.querySelectorAll('[data-miss]').forEach(function (cb) {
      cb.onchange = function () { s.players[+this.dataset.miss].missing = this.checked; changed(); };
    });
    function move(p, q) {
      var order = s.players.map(function (x, i) { return i; });
      order[p] = q; order[q] = p; PM.reorderPlayers(s, order); changed();
    }
    main.querySelectorAll('[data-up]').forEach(function (b) { b.onclick = function () { var p = +b.dataset.up; move(p, p - 1); }; });
    main.querySelectorAll('[data-down]').forEach(function (b) { b.onclick = function () { var p = +b.dataset.down; move(p, p + 1); }; });
    main.querySelectorAll('[data-del]').forEach(function (b) {
      b.onclick = function () {
        var p = +b.dataset.del;
        if (!confirm('Remove ' + PM.displayName(s.players[p].name) + '?')) return;
        try { PM.removePlayer(s, p); } catch (e) { alert(e.message); }
        changed();
      };
    });
    main.querySelectorAll('[data-move]').forEach(function (sel) {
      sel.onchange = function () {

        if (PM.hasGames(to)) { alert('Division ' + to.name + ' has already started.'); return render(); }

  // ---------- rounds & scores ----------
  function resultText(s, p, r) {
    var g = PM.game(s, p, r);
    var o = g.opp, og = PM.game(s, o, r);
    if (g.score < PM.MIN_SCORE || og.score < PM.MIN_SCORE) return '';
    var d = g.score - og.score;
    if (d === 0) return 'Tie ' + g.score + '–' + og.score;
    var w = d > 0 ? p : o;
    return nm(s, w) + ' wins by ' + Math.abs(d);
  }

  function gibsonCfg(s) {
    return { totalRounds: s.totalRounds || 0, prizes: s.prizes || 1, mode: s.gibsonMode || 'off', missingMayReturn: s.gibsonMissingReturn === true };
  }
  function gibsonUsed(method) { return method === 'australian' || method === 'lagged' || method === 'koth'; }
  function gibsonSelected(s, plan) {
    return plan.gibsons.filter(function (g) { return !draft.gibUntick[st.sec + ':' + g.idx]; }).map(function (g) { return g.idx; });
  }
  function ordinal(n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

  function gibsonBlock(s, nextR) {
    if (!gibsonUsed(draft.method)) return '';
    var cfg = gibsonCfg(s);
    var modeOpts = PM.GIBSON_MODES.map(function (m) { return '<option value="' + m.id + '"' + (m.id === cfg.mode ? ' selected' : '') + '>' + m.label + '</option>'; }).join('');
    var h = '<details class="gib"' + (cfg.mode !== 'off' ? ' open' : '') + '><summary><b>Gibsonization</b> <span class="hint">' +
      (cfg.mode === 'off' ? 'off' : 'on – ' + cfg.prizes + ' prize' + (cfg.prizes === 1 ? '' : 's')) + '</span></summary>' +
      '<div class="row"><label title="The whole event, not the round you are drawing: for a 12-round event enter 12">Total rounds in this division (whole event)</label><input id="g-rounds" type="number" min="1" style="width:70px" value="' + (s.totalRounds || '') + '">' +
      '<label>Prizes</label><input id="g-prizes" type="number" min="1" style="width:70px" value="' + (s.prizes || '') + '"></div>' +
      '<div class="row"><label>Who is Gibsonized</label><select id="g-mode">' + modeOpts + '</select>' +
      '<label title="Tick if absent players sometimes come back: they then count as able to win their remaining games"><input type="checkbox" id="g-missing"' +
      (s.gibsonMissingReturn === true ? ' checked' : '') + '> Missing players may come back</label></div>';
    if (cfg.mode !== 'off') {
      if (!cfg.totalRounds) h += '<p class="pill warn">Enter the total number of rounds in this division for the whole event (for example 12 for a 12-round event), so PairMaster knows how many games are left.</p>';
      else {
        var standRound = draft.method === 'lagged' && nextR >= 3 ? nextR - 2 : nextR - 1;
        var plan = PM.gibsonPlan(st.t, s, nextR, cfg, standRound, draft.freshStart);
        var sel = gibsonSelected(s, plan);
        plan = PM.gibsonPlan(st.t, s, nextR, { totalRounds: cfg.totalRounds, prizes: cfg.prizes, mode: cfg.mode, missingMayReturn: cfg.missingMayReturn, players: sel }, standRound, draft.freshStart);

        if (!plan.remaining) h += '<p class="hint">No rounds left after this one to Gibsonize for.</p>';
        else if (!plan.gibsons.length) h += '<p class="hint">Nobody has clinched yet (' + plan.remaining + ' game' + (plan.remaining === 1 ? '' : 's') + ' left including this one, judged on wins).</p>';
        else {
          h += '<p class="hint">Clinched (' + plan.remaining + ' game' + (plan.remaining === 1 ? '' : 's') + ' left). Untick anyone you don\'t want Gibsonized:</p>';
          plan.gibsons.forEach(function (g) {
            var what;
            var gibOpp = g.opp !== null && plan.gibsons.some(function (o) { return o.idx === g.opp; });
            if (!g.selected) what = 'drawn normally';
            else if (g.bye) what = 'takes the bye (odd number of players)';
            else if (g.opp === null) what = 'nobody is free out of the prizes, so drawn normally';
            else if (gibOpp) what = 'will play <b>' + nm(s, g.opp) + '</b> (also Gibsonized: too few players are out of the prizes)';
            else what = 'will play <b>' + nm(s, g.opp) + '</b> (highest-ranked player out of the prizes)';
            h += '<div class="row"><label><input type="checkbox" data-gib="' + g.idx + '"' + (g.selected ? ' checked' : '') + '> <b>' +
              nm(s, g.idx) + '</b> has clinched ' + ordinal(g.place) + ' place</label><span class="hint">– ' + what + '</span></div>';
          });
        }
      }
    }
    return h + '</details>';
  }

  function renderRound(main) {
    var s = sec(), drawn = PM.roundsDrawn(s), complete = PM.roundsComplete(s);
    if (st.round > drawn + 1) st.round = drawn + 1;
    if (st.round < 1) st.round = 1;
    var r = st.round;
    if (!s.players.length) { main.innerHTML = '<div class="card">Add players to this division first.</div>'; return; }

    var nextR = PM.nextRoundFor(s, draft.method);
    var opts = '';
    for (var i = 1; i <= Math.max(drawn, 1); i++) opts += '<option value="' + i + '"' + (i === r ? ' selected' : '') + '>Round ' + i + '</option>';
    var hasRes = complete > 0;
    var methodOpts = PM.METHODS.map(function (m) { return '<option value="' + m.id + '"' + (m.id === draft.method ? ' selected' : '') + '>' + m.label + '</option>'; }).join('');
    var firstOpts = PM.FIRST_ROUND.map(function (m) { return '<option value="' + m.id + '"' + (m.id === draft.firstRound ? ' selected' : '') + '>' + m.label + '</option>'; }).join('');
    var missing = s.players.filter(function (pl) { return pl.missing; }).map(function (pl) { return esc(PM.displayName(pl.name)); });

    var h = '<div class="card"><h2>Draw – Division ' + esc(s.name) + '</h2>' +
      '<p class="hint">' + complete + ' round' + (complete === 1 ? '' : 's') + ' complete, ' + drawn + ' drawn.</p>' +
      '<div class="row"><label>Method</label><select id="d-method">' + methodOpts + '</select></div>' +
      (!hasRes ? '<div class="row"><label>First round</label><select id="d-first">' + firstOpts + '</select></div>' : '') +
      (draft.method === 'australian' || draft.method === 'lagged'
        ? '<div class="row"><label>Fresh start with game</label><input id="d-fresh" type="number" min="1" style="width:70px" value="' + draft.freshStart + '"><span class="hint">Leave at 1 unless you want to allow rematches against opponents from before that game.</span></div>' : '') +
      (s.avoidSameSchool === true
        ? '<p class="hint">' + (draft.method === 'roundrobin' || draft.method === 'koth' || draft.method === 'halves'
          ? 'This method ignores schools.' : 'Schoolmates are kept apart where possible (set on the Players tab).') + '</p>' : '') +
      gibsonBlock(s, nextR) +
      (missing.length ? '<p class="pill warn">Marked missing (designated loss): ' + missing.join(', ') + '</p>' : '') +
      '<div class="row"><button id="d-go" class="' + (nextR <= drawn ? '' : 'primary') + '">' +
      (draft.method === 'roundrobin' ? 'Draw round robin from round ' + nextR : (nextR <= drawn ? 'Redraw round ' : 'Draw round ') + nextR) +
      '</button>' + (nextR <= drawn ? '<span class="hint">Round ' + nextR + ' is drawn. Enter its scores, then draw round ' + (nextR + 1) + '.</span>' : '') +
      '</div></div>';

    h += '<div class="card"><div class="row"><h2 style="margin:0">Pairings &amp; scores</h2><select id="r-pick">' + opts + '</select>';
    if (r <= drawn) {
      var miss = PM.missingResults(s, r);
      h += '<button id="r-pill" class="pill' + (miss.length ? ' warn' : '') + '" title="Show who is missing">' +
        (miss.length ? miss.length + ' score' + (miss.length === 1 ? '' : 's') + ' to enter ▾' : 'All results in') + '</button>';
      h += '<span class="spacer"></span><button id="r-clear" class="small danger">Clear this round</button>';
    }
    h += '</div>' + (r <= drawn ? '<div id="r-missing" class="missing-list"' + (st.showMissing ? '' : ' hidden') + '></div>' : '');
    if (r > drawn) {
      h += '<p class="hint">Round ' + r + ' has not been drawn yet.</p></div>';
      main.innerHTML = h; bindDraw(s); return;
    }
    var tables = PM.assignTables(st.t, r);
    var order = PM.standings(st.t, s, r - 1).map(function (x) { return x.idx; });
    var shown = {}, rows = [], byes = [];
    order.forEach(function (p) {
      if (shown[p]) return;
      var g = PM.game(s, p, r);
      if (!g) return;
      shown[p] = true;
      if (g.opp === p) { byes.push(p); return; }
      shown[g.opp] = true;
      var a = p, b = g.opp;
      rows.push({ a: a, b: b, table: tables[st.sec + ':' + a] });
    });
    rows.sort(function (x, y) { return (x.table || 0) - (y.table || 0); });
    var playerOpts = function (sel) {
      return '<option value="">Change opponent…</option>' + s.players.map(function (pl, q) {
        return q === sel ? '' : '<option value="' + q + '">' + nm(s, q) + '</option>';
      }).join('');
    };
    h += '<p class="hint">Type a score and press Enter to jump to the next box. <span class="starter">*</span> = starts the game. Click ⇄ to change who starts.</p>' +
      '<div class="row"><input id="r-find" placeholder="Table number or name, then Enter" size="30" title="Shortcut: press / to come here">' +
      '<span class="hint">Type a table number or the start of a name and press Enter to jump to that game.</span></div>' +
      '<table><thead><tr><th class="num">Table</th><th>Player</th><th class="num">Score</th><th class="num">Score</th><th>Opponent</th><th>Result</th><th></th></tr></thead><tbody>';
    rows.forEach(function (row) {
      var ga = PM.game(s, row.a, r), gb = PM.game(s, row.b, r);
      h += '<tr data-row="' + row.a + ' ' + row.b + '"><td class="num">' + (row.table || '') + '</td>' +
        '<td><span class="starter">' + (ga.first ? '*' : '') + '</span>' + nm(s, row.a) + '</td>' +
        '<td class="num"><input class="score" inputmode="numeric" data-score="' + row.a + '" value="' + (ga.score || '') + '"></td>' +
        '<td class="num"><input class="score" inputmode="numeric" data-score="' + row.b + '" value="' + (gb.score || '') + '"></td>' +
        '<td><span class="starter">' + (gb.first ? '*' : '') + '</span>' + nm(s, row.b) +
        (s.avoidSameSchool === true && PM.schoolOf(s, row.a) && PM.schoolOf(s, row.a) === PM.schoolOf(s, row.b) ? ' <span class="pill warn" title="Both players are from ' + esc(s.players[row.a].school) + '">same school</span>' : '') + '</td>' +
        '<td class="result" id="res-' + row.a + '">' + resultText(s, row.a, r) + '</td>' +
        '<td class="actions"><button class="small" data-toggle="' + row.a + '" title="Change who starts">⇄</button> ' +
        '<select class="small" data-repair="' + row.a + '">' + playerOpts(row.a) + '</select> ' +
        '<select class="small" data-ng="' + row.a + '"><option value="">Nongame…</option>' +
        '<option value="L">' + nm(s, row.a) + ': designated loss</option><option value="W">' + nm(s, row.a) + ': designated win</option>' +
        '<option value="D">' + nm(s, row.a) + ': designated draw</option>' +
        '<option value="L' + row.b + '">' + nm(s, row.b) + ': designated loss</option><option value="W' + row.b + '">' + nm(s, row.b) + ': designated win</option>' +
        '<option value="F' + row.a + '">' + nm(s, row.a) + ' forfeits (' + nm(s, row.b) + ' wins by ' + forfeitMargin() + ')</option>' +
        '<option value="F' + row.b + '">' + nm(s, row.b) + ' forfeits (' + nm(s, row.a) + ' wins by ' + forfeitMargin() + ')</option>' +
        '<option value="D' + row.b + '">' + nm(s, row.b) + ': designated draw</option></select></td></tr>';
    });
    byes.forEach(function (p) {
      var g = PM.game(s, p, r), label = g.rawOpp ? 'Needs an opponent – use Pair with… or Change…'
        : nongameLabel(g);
      h += '<tr><td></td><td>' + nm(s, p) + (s.players[p].missing ? ' <span class="pill warn">missing</span>' : '') + '</td><td colspan="3"><span class="pill">' + label + '</span></td><td></td>' +
        '<td class="actions"><select class="small" data-ngself="' + p + '"><option value="">Change…</option><option value="W">Designated win</option><option value="L">Designated loss</option><option value="D">Designated draw</option></select> ' +
        '<select class="small" data-repair="' + p + '">' + playerOpts(p).replace('Change opponent…', 'Pair with…') + '</select></td></tr>';
    });
    h += '</tbody></table></div>';

    var hw = s.highWord || { text: '', score: 0 }, hg = PM.highGame(s);
    h += '<div class="card"><h2>High scores – Division ' + esc(s.name) + '</h2><div class="row"><label>High word (word and player)</label>' +
      '<input id="hw-text" size="30" value="' + esc(hw.text) + '" placeholder="QUIXOTIC Ann Lee"><label>Score</label>' +
      '<input id="hw-score" class="score" inputmode="numeric" value="' + (hw.score || '') + '"></div>' +
      '<p class="hint">High game: ' + (hg.score ? hg.score + ' – ' + esc(hg.names.join(', ')) : 'none yet') + '</p></div>';
    main.innerHTML = h;
    bindDraw(s);
    bindRound(s, r);
  }

  function bindDraw(s) {
    $('d-method').onchange = function () { draft.method = this.value; render(); };
    if ($('d-first')) $('d-first').onchange = function () { draft.firstRound = this.value; };
    if ($('d-fresh')) $('d-fresh').onchange = function () { draft.freshStart = Math.max(1, parseInt(this.value, 10) || 1); render(); };
    if ($('g-rounds')) $('g-rounds').onchange = function () { s.totalRounds = Math.max(0, parseInt(this.value, 10) || 0); changed(); };
    if ($('g-prizes')) $('g-prizes').onchange = function () { s.prizes = Math.max(1, parseInt(this.value, 10) || 1); changed(); };
    if ($('g-mode')) $('g-mode').onchange = function () { s.gibsonMode = this.value; changed(); };
    if ($('g-missing')) $('g-missing').onchange = function () { if (this.checked) s.gibsonMissingReturn = true; else delete s.gibsonMissingReturn; changed(); };
    $('main').querySelectorAll('[data-gib]').forEach(function (cb) {
      cb.onchange = function () { draft.gibUntick[st.sec + ':' + this.dataset.gib] = !this.checked; render(); };
    });
    if ($('r-pick')) $('r-pick').onchange = function () { st.round = +this.value; changed(); };
    $('d-go').onclick = function () {
      var round = PM.nextRoundFor(s, draft.method);
      var drawn = PM.roundsDrawn(s);
      if (draft.method === 'lagged' && round < 3) { alert('Lagged Australian can only be used from round 3. Use another method for rounds 1 and 2.'); return; }
      var lostScores = false;
      for (var r = round; r <= drawn; r++) for (var p = 0; p < s.players.length; p++) {
        var g = PM.game(s, p, r); if (g && g.opp !== p && g.score > 0) lostScores = true;
      }
      if (round <= drawn && !confirm('Round ' + round + (drawn > round ? ' (and later rounds)' : '') + ' is already drawn' +
        (lostScores ? ' and some scores are entered. Those scores will be lost.' : '.') + ' Redraw it?')) return;
      var missing = s.players.filter(function (pl) { return pl.missing; }).map(function (pl) { return PM.displayName(pl.name); });
      if (missing.length && !confirm('Still missing: ' + missing.join(', ') + '.\nThey will get a designated loss. Continue?')) return;
      var gopts = null, cfg = gibsonCfg(s);
      if (gibsonUsed(draft.method) && cfg.mode !== 'off' && cfg.totalRounds) {
        var sr = draft.method === 'lagged' && round >= 3 ? round - 2 : round - 1;
        var all = PM.gibsonPlan(st.t, s, round, cfg, sr, draft.freshStart);
        gopts = { totalRounds: cfg.totalRounds, prizes: cfg.prizes, mode: cfg.mode, missingMayReturn: cfg.missingMayReturn, players: gibsonSelected(s, all) };
      }
      PM.draw(st.t, s, draft.method, { firstRound: draft.firstRound, freshStart: draft.freshStart, round: round, gibson: gopts });
      st.round = round; changed();
    };
  }

  function bindRound(s, r) {
    var main = $('main');
    if ($('r-clear')) $('r-clear').onclick = function () {
      if (!confirm('Clear round ' + r + (PM.roundsDrawn(s) > r ? ' and every later round' : '') + '? Pairings and scores will be removed.')) return;
      PM.blankRound(s, r); st.round = Math.max(1, r - 1); changed();
    };
    var inputs = Array.prototype.slice.call(main.querySelectorAll('[data-score]'));
    function renderMissing() {
      var pill = $('r-pill'), list = $('r-missing'), miss = PM.missingGames(st.t, st.sec, r);
      if (pill) { pill.className = 'pill' + (miss.length ? ' warn' : ''); pill.textContent = miss.length ? PM.missingResults(s, r).length + ' score' + (PM.missingResults(s, r).length === 1 ? '' : 's') + ' to enter ▾' : 'All results in'; }
      if (list) list.innerHTML = miss.length ? '<b>Still to come in round ' + r + ':</b> ' + miss.map(function (x) {
        return x.b === null ? nm(s, x.a) + ' (needs an opponent)' : (x.table ? 'Table ' + x.table + ': ' : '') + nm(s, x.a) + ' v ' + nm(s, x.b);
      }).join(' · ') : 'All results are in.';
    }
    renderMissing();
    if ($('r-pill')) $('r-pill').onclick = function () { st.showMissing = !st.showMissing; $('r-missing').hidden = !st.showMissing; };
    // Returns false when the director wants to correct the score (typo guard), so Enter doesn't move on.
    function enterScore(inp) {
      var v = inp.value.trim(), p = +inp.dataset.score, g0 = PM.game(s, p, r), was = g0 && g0.score ? String(g0.score) : '';
      if (v === was) return true;
      if (v !== '' && !/^\d{1,3}$/.test(v)) { alert('Enter a score from 0 to 999.'); inp.value = was; inp.select(); return false; }
      var msg = PM.scoreCheck(s, r, p, v === '' ? 0 : parseInt(v, 10));
      if (msg && !confirm(msg + '\n\nOK keeps it; Cancel lets you correct it.')) { inp.value = was; inp.focus(); inp.select(); return false; }
      var wasComplete = PM.isRoundComplete(s, r);
      PM.setScore(s, r, p, v === '' ? 0 : parseInt(v, 10));
      // When this score finishes (or un-finishes) the round, redraw so the draw panel's counts and button are current.
      if (PM.isRoundComplete(s, r) !== wasComplete) { changed(); renderBanner(); return true; }
      var g = PM.game(s, p, r);
      var cellA = $('res-' + p) || $('res-' + g.opp);
      if (cellA) cellA.innerHTML = resultText(s, p, r);
      save(); renderBanner(); renderMissing();
      return true;
    }
    inputs.forEach(function (inp, i) {
      inp.onchange = function () { enterScore(this); };
      inp.onkeydown = function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (!enterScore(this)) return;
        var n = inputs[i + 1], find = $('r-find');
        // Finished a game found with the search box: go back to the box, ready for the next result slip.
        if (find && find.value && (!n || n.closest('tr') !== this.closest('tr'))) { find.value = ''; find.oninput(); find.focus(); return; }
        while (n && n.closest('tr').style.display === 'none') n = inputs[inputs.indexOf(n) + 1];
        if (n) { n.focus(); n.select(); }
      };
    });
    function rowTable(tr) { var t = parseInt(tr.children[0].textContent, 10); return isNaN(t) ? null : t; }
    if ($('r-find')) {
      $('r-find').oninput = function () {
        var q = this.value;
        main.querySelectorAll('tr[data-row]').forEach(function (tr) {
          var ps = tr.dataset.row.split(' ');
          tr.style.display = PM.gameMatches(s, +ps[0], +ps[1], rowTable(tr), q) ? '' : 'none';
        });
      };
      $('r-find').onkeydown = function (e) {
        if (e.key === 'Escape') { this.value = ''; this.oninput(); return; }
        if (e.key !== 'Enter') return;
        e.preventDefault();
        var vis = Array.prototype.filter.call(main.querySelectorAll('tr[data-row]'), function (tr) { return tr.style.display !== 'none'; });
        if (!vis.length) return;
        var box = Array.prototype.filter.call(vis[0].querySelectorAll('[data-score]'), function (x) { return !x.value; })[0] || vis[0].querySelector('[data-score]');
        box.focus(); box.select();
      };
    }
    main.querySelectorAll('[data-toggle]').forEach(function (b) {
      b.onclick = function () { PM.toggleStart(s, r, +b.dataset.toggle); changed(); };
    });
    main.querySelectorAll('[data-repair]').forEach(function (sel) {
      sel.onchange = function () {
        if (this.value === '') return;
        try { PM.setPairing(s, r, +this.dataset.repair, +this.value); } catch (e) { alert(e.message); }
        changed();
      };
    });
    main.querySelectorAll('[data-ng]').forEach(function (sel) {
      sel.onchange = function () {
        var v = this.value; if (!v) return;
        var kind = v.charAt(0), p = v.length > 1 ? +v.slice(1) : +this.dataset.ng;
        var g = PM.game(s, p, r), og = g && g.opp !== p ? PM.game(s, g.opp, r) : null;
        if (g && og && (g.score > 0 || og.score > 0) &&
          !confirm('Scores are already entered for this game. Replace them with a ' + (kind === 'F' ? 'forfeit' : 'designated result') + '?')) { this.value = ''; return; }
        if (kind === 'F') { PM.setForfeit(st.t, s, r, p); changed(); return; } // both players get their result at once
        var left = g && g.opp !== p ? g.opp : null;
        PM.setNongame(s, r, p, kind); changed();
        if (left !== null) alert(PM.displayName(s.players[left].name) + ' now has no opponent in round ' + r +
          '. Use "Pair with…" to pair them with someone, or "Change…" to give them a bye or designated result.');
      };
    });
    main.querySelectorAll('[data-ngself]').forEach(function (sel) {
      sel.onchange = function () { if (this.value) { PM.setNongame(s, r, +this.dataset.ngself, this.value); changed(); } };
    });
    $('hw-text').onchange = function () { s.highWord = { text: this.value.replace(/\s+/g, ' ').trim(), score: (s.highWord || {}).score || 0 }; save(); };
    $('hw-score').onchange = function () { s.highWord = { text: (s.highWord || {}).text || '', score: parseInt(this.value, 10) || 0 }; save(); };
  }

  // ---------- standings ----------
  function standingsTable(s, upTo) {
    var key = st.t.rankMethod === 'A' ? 'total' : 'spread';
    var rows = PM.standings(st.t, s, upTo), anyBye = false;
    var h = '<table><thead><tr><th class="num">Rank</th><th>Player</th><th class="num">Wins</th><th class="num">Losses</th><th class="num">' +
      (key === 'total' ? 'Total' : 'Spread') + '</th><th class="num">Games</th><th class="num" title="Games started (went first) – games replied (went second)">1st–2nd</th></tr></thead><tbody>';
    rows.forEach(function (x) {
      var w = fmtWins(x.wins), sp = key === 'total' ? String(x.total) : fmtSigned(x.spread);
      if (x.byes && (x.byeWins || x.byeSpread)) {
        anyBye = true;
        w = fmtWins(x.wins - x.byeWins) + '<sup>(+' + fmtWins(x.byeWins) + ')</sup>';
        if (key === 'spread') sp = fmtSigned(x.spread - x.byeSpread) + '<sup>(' + fmtSigned(x.byeSpread) + ')</sup>';
      }
      h += '<tr><td class="num">' + x.rank + '</td><td>' + nm(s, x.idx) + (s.players[x.idx].missing ? ' <span class="hint">(missing)</span>' : '') +
        '</td><td class="num">' + w + '</td><td class="num">' + fmtWins(x.losses) + '</td><td class="num">' + sp + '</td><td class="num">' + x.games + '</td>' +
        '<td class="num"' + (Math.abs(x.firsts - x.seconds) >= 2 ? ' title="Two or more off an even split"><b>' + x.firsts + '–' + x.seconds + '</b>' : '>' + x.firsts + '–' + x.seconds) + '</td></tr>';
    });
    h += '</tbody></table>';
    if (anyBye) h += '<p class="hint">Byes, designated results and forfeits are shown in brackets; they count for placings but not ratings.</p>';
    return h;
  }
  function highLines(s) {
    var hg = PM.highGame(s), hw = s.highWord || {};
    return '<p>' + (hg.score ? '<b>High game:</b> ' + esc(hg.names.join(', ')) + ' ' + hg.score : '') +
      (hw.score ? ' &nbsp; <b>High word:</b> ' + esc(hw.text) + ' ' + hw.score : '') + '</p>';
  }
  function renderStandings(main) {
    var s = sec(), complete = PM.roundsComplete(s), drawn = PM.roundsDrawn(s);
    var upTo = st.standRound === null ? complete : Math.min(st.standRound, drawn);
    var opts = '';
    for (var i = 0; i <= drawn; i++) opts += '<option value="' + i + '"' + (i === upTo ? ' selected' : '') + '>After round ' + i + (i > complete ? ' (incomplete)' : '') + '</option>';
    main.innerHTML = '<div class="card"><div class="row"><h2 style="margin:0">Standings – Division ' + esc(s.name) + '</h2><select id="st-pick">' + opts + '</select>' +
      '<span class="spacer"></span><button id="st-board" class="small" title="Opens large standings in a new window for the hall screen; they update as you enter scores">Projector view ↗</button></div>' +
      standingsTable(s, upTo) + highLines(s) + '</div>' + playoffCard(s);
    $('st-pick').onchange = function () { st.standRound = +this.value; render(); };
    bindPlayoff(s);
    $('st-board').onclick = function () { window.open(location.href.split('#')[0] + (practice ? '#scoreboard-practice' : '#scoreboard'), 'pairmaster-board'); };
  }

  // ---------- playoff final (optional) ----------
  function playoffLine(s) {
    var ps = PM.playoffStatus(s);
    if (ps && PM.playoffStale(st.t, s)) return '<p class="pill warn">Playoff final: ' + nm(s, ps.a) + ' and ' + nm(s, ps.b) +
      ' are no longer 1st and 2nd in the standings, so the playoff is not counted. Remove it and start it again.</p>';
    if (!ps || !ps.played) return '';
    var score = fmtWins(Math.max(ps.winsA, ps.winsB)) + '–' + fmtWins(Math.min(ps.winsA, ps.winsB));
    if (ps.done) return '<p><b>Playoff final (best of ' + ps.bestOf + '):</b> ' + nm(s, ps.winner) + ' beat ' + nm(s, ps.loser) + ' ' + score +
      (ps.reason === 'spread' ? ', level on games, won on playoff spread' : ps.reason === 'seed' ? ', level on games and spread, won as the Swiss leader' : '') + '</p>';
    var lead = ps.winsA === ps.winsB ? 'level ' + fmtWins(ps.winsA) + '–' + fmtWins(ps.winsB) : nm(s, ps.winsA > ps.winsB ? ps.a : ps.b) + ' leads ' + score;
    return '<p><b>Playoff final (best of ' + ps.bestOf + '):</b> ' + nm(s, ps.a) + ' v ' + nm(s, ps.b) + ', ' + lead + '</p>';
  }
  function playoffStatusHtml(s) { return playoffLine(s) || '<p class="hint">No playoff games entered yet. <span class="starter">*</span> = starts.</p>'; }
  function playoffCard(s) {
    var ps = PM.playoffStatus(s);
    var h = '<div class="card"><h2>Playoff final <span class="hint">(optional)</span></h2>';
    if (!ps) {
      return h + '<p class="hint">After the last round, 1st and 2nd can play a short match for the title. It doesn\'t change the standings above or the .TOU file; ' +
        'the prize list shows the winner as 1st.</p><div class="row"><label>Best of</label><select id="po-best"><option value="3">3 games</option><option value="5">5 games</option></select>' +
        '<button id="po-start" class="small">Start a playoff between 1st and 2nd</button></div></div>';
    }
    h += '<p><b>' + nm(s, ps.a) + '</b> (1st after the rounds) v <b>' + nm(s, ps.b) + '</b> (2nd) · best of ' + ps.bestOf + ', first to ' + ps.target + ' wins (a tie counts ½).</p>';
    h += '<table><thead><tr><th class="num">Game</th><th>' + nm(s, ps.a) + '</th><th class="num">Score</th><th class="num">Score</th><th>' + nm(s, ps.b) + '</th><th></th></tr></thead><tbody>';
    ps.games.forEach(function (g, i) {
      var off = ps.done && !g.counted && !g.played;
      h += '<tr' + (off ? ' class="missing"' : '') + '><td class="num">' + g.n + '</td><td><span class="starter">' + (g.aFirst ? '*' : '') + '</span></td>' +
        '<td class="num"><input class="score" inputmode="numeric" data-po-a="' + i + '" value="' + (g.aScore || '') + '"' + (off ? ' disabled' : '') + '></td>' +
        '<td class="num"><input class="score" inputmode="numeric" data-po-b="' + i + '" value="' + (g.bScore || '') + '"' + (off ? ' disabled' : '') + '></td>' +
        '<td><span class="starter">' + (g.aFirst ? '' : '*') + '</span></td><td><button class="small" data-po-first="' + i + '" title="Change who starts">⇄</button></td></tr>';
    });
    h += '</tbody></table><div id="po-status">' + playoffStatusHtml(s) + '</div>' +
      '<button id="po-remove" class="small danger">Remove the playoff</button></div>';
    return h;
  }
  function bindPlayoff(s) {
    if ($('po-start')) $('po-start').onclick = function () {
      if (PM.roundsComplete(s) < PM.roundsDrawn(s) && !confirm('The last round is not finished. Start the playoff with the current standings anyway?')) return;
      try { PM.startPlayoff(st.t, s, +$('po-best').value); } catch (e) { alert(e.message); return; }
      changed();
    };
    if ($('po-remove')) $('po-remove').onclick = function () { if (confirm('Remove the playoff and its scores? (Undo can bring it back.)')) { PM.removePlayoff(s); changed(); } };
    // Scores are saved as they are typed, and the panel is updated in place (not redrawn), so the cursor stays put.
    var boxes = Array.prototype.slice.call($('main').querySelectorAll('[data-po-a], [data-po-b]'));
    function refreshPlayoff() {
      var ps = PM.playoffStatus(s);
      $('po-status').innerHTML = playoffStatusHtml(s);
      ps.games.forEach(function (g, i) {
        var off = ps.done && !g.counted && !g.played;
        $('main').querySelector('[data-po-a="' + i + '"]').disabled = off;
        $('main').querySelector('[data-po-b="' + i + '"]').disabled = off;
      });
    }
    function enterPlayoff(inp) {
      var i = +(inp.dataset.poA !== undefined ? inp.dataset.poA : inp.dataset.poB);
      var a = $('main').querySelector('[data-po-a="' + i + '"]').value.trim(), b = $('main').querySelector('[data-po-b="' + i + '"]').value.trim();
      var g = s.playoff.games[i], was = g ? String((inp.dataset.poA !== undefined ? g.aScore : g.bScore) || '') : '';
      if (inp.value.trim() === was) return true;
      if ((a && !/^\d{1,3}$/.test(a)) || (b && !/^\d{1,3}$/.test(b))) { alert('Enter a score from 0 to 999.'); inp.value = was; inp.select(); return false; }
      var msg = inp.value.trim() ? PM.scoreCheckValue(+inp.value.trim()) : '';
      if (msg && !confirm(msg + '\n\nOK keeps it; Cancel lets you correct it.')) { inp.value = was; inp.select(); return false; }
      PM.setPlayoffGame(s, i, a || 0, b || 0); save(); refreshPlayoff();
      return true;
    }
    boxes.forEach(function (inp, k) {
      inp.onchange = function () { enterPlayoff(this); };
      inp.onkeydown = function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (!enterPlayoff(this)) return;
        var n = boxes[k + 1];
        while (n && n.disabled) n = boxes[boxes.indexOf(n) + 1];
        if (n) { n.focus(); n.select(); }
      };
    });
    $('main').querySelectorAll('[data-po-first]').forEach(function (b) {
      b.onclick = function () {
        var i = +this.dataset.poFirst, g = s.playoff.games[i];
        if (!g) { PM.setPlayoffGame(s, i, 0, 0); g = s.playoff.games[i]; }
        g.aFirst = !g.aFirst; changed();
      };
    });
  }

  // ---------- printing ----------
  function pairingsPrint(s, si, r) {
    var tables = PM.assignTables(st.t, r), prev = r - 1;
    var stand = PM.standings(st.t, s, prev), rankOf = {};
    stand.forEach(function (x) { rankOf[x.idx] = x; });
    var list = s.players.map(function (pl, p) { return p; });
    list.sort(function (a, b) { return PM.displayName(s.players[a].name).localeCompare(PM.displayName(s.players[b].name)); });
    var key = st.t.rankMethod === 'A' ? 'total' : 'spread';
    var h = '<h1>' + esc(s.name) + ' – Pairings for round ' + r + '</h1><h2>' + esc(st.t.title) + ' · ' + esc(st.t.date) +
      (prev > 0 ? ' · standings after round ' + prev : '') + '</h2><table><thead><tr><th>Player</th>' +
      (prev > 0 ? '<th class="num">Wins</th><th class="num">' + (key === 'total' ? 'Total' : 'Spread') + '</th>' : '') +
      '<th class="num">Table</th><th>Opponent</th></tr></thead><tbody>';
    list.forEach(function (p) {
      var g = PM.game(s, p, r); if (!g) return;
      var x = rankOf[p];
      h += '<tr><td><span class="starter">' + (g.first ? '*' : '') + '</span>' + nm(s, p) + '</td>' +
        (prev > 0 ? '<td class="num">' + fmtWins(x.wins) + '</td><td class="num">' + (key === 'total' ? x.total : fmtSigned(x.spread)) + '</td>' : '');
      if (g.opp === p) h += '<td></td><td>' + (g.rawOpp ? 'To be paired' : nongameLabel(g, 'print')) + '</td></tr>';
      else h += '<td class="num">' + (tables[si + ':' + p] || '') + '</td><td><span class="starter">' + (PM.game(s, g.opp, r).first ? '*' : '') + '</span>' + nm(s, g.opp) + '</td></tr>';
    });
    return h + '</tbody></table><p>The player with the asterisk (*) plays first.</p>';
  }
  function slipsPrint(s, si, r) {
    var slips = PM.resultSlips(st.t, si, r);
    if (!slips.length) return '<h1>' + esc(s.name) + ' – Result slips, round ' + r + '</h1><p>No games to play in this round.</p>';
    function line(p, first) {
      return '<tr><td class="slip-name"><span class="starter">' + (first ? '*' : '') + '</span>' + nm(s, p) + '</td><td class="slip-box"></td></tr>';
    }
    return '<div class="slips">' + slips.map(function (x) {
      return '<div class="slip"><div class="slip-head"><b>' + esc(s.name) + '</b> · Round ' + r + (x.table ? ' · <b>Table ' + x.table + '</b>' : '') + '</div>' +
        '<table><thead><tr><th>Player (* starts)</th><th>Score</th></tr></thead><tbody>' + line(x.a, x.aFirst) + line(x.b, x.bFirst) +
        '<tr><td class="slip-name">Winner\'s spread</td><td class="slip-box"></td></tr></tbody></table>' +
        '<div class="slip-sign">Winner\'s signature ____________ &nbsp; Loser\'s ____________</div></div>';
    }).join('') + '</div>';
  }
  function schedulePrint(s) {
    var drawn = PM.roundsDrawn(s);
    var h = '<h1>' + esc(s.name) + ' – Full schedule</h1><h2>' + esc(st.t.title) + ' · ' + esc(st.t.date) + '</h2><table><thead><tr><th>Player</th>';
    for (var r = 1; r <= drawn; r++) h += '<th>R' + r + '</th>';
    h += '</tr></thead><tbody>';
    s.players.forEach(function (pl, p) {
      h += '<tr><td>' + (p + 1) + '. ' + nm(s, p) + '</td>';
      for (var r2 = 1; r2 <= drawn; r2++) {
        var g = PM.game(s, p, r2);
        h += '<td>' + (!g ? '' : g.opp === p ? 'bye' : (g.first ? '*' : '') + (g.opp + 1)) + '</td>';
      }
      h += '</tr>';
    });
    return h + '</tbody></table><p>Numbers are opponents\' numbers. * = plays first.</p>';
  }
  function standingsPrint(s, upTo) {
    return '<h1>' + esc(s.name) + ' – Standings after round ' + upTo + (upTo > PM.roundsComplete(s) ? ' (round not finished)' : '') + '</h1><h2>' + esc(st.t.title) + ' · ' + esc(st.t.date) + '</h2>' +
      standingsTable(s, upTo) + highLines(s) + playoffLine(s);
  }
  function resultsPrint(s, si, r) {
    var head = '<h1>' + esc(s.name) + ' – Results of round ' + r + '</h1><h2>' + esc(st.t.title) + ' · ' + esc(st.t.date) + '</h2>';
    var rows = PM.roundResults(st.t, s, r);
    if (!rows.length) return head + '<p>Round ' + r + ' has not been drawn in this division.</p>';
    var tables = PM.assignTables(st.t, r), pending = 0;
    var games = rows.filter(function (x) { return x.b !== null; });
    games.sort(function (x, y) { return (tables[si + ':' + x.a] || 0) - (tables[si + ':' + y.a] || 0); });
    function who(p, first, won) {
      var n = nm(s, p);
      return '<span class="starter">' + (first ? '*' : '') + '</span>' + (won ? '<b>' + n + '</b>' : n);
    }
    var h = head + '<table><thead><tr><th class="num">Table</th><th>Player</th><th class="num">Score</th><th class="num">Score</th><th>Opponent</th><th>Result</th></tr></thead><tbody>';
    games.forEach(function (x) {
      var res = x.outcome === 'win' ? nm(s, x.winner) + ' won by ' + x.margin : x.outcome === 'tie' ? 'Tie' : 'Result not entered';
      if (x.outcome === 'pending') pending++;
      h += '<tr><td class="num">' + (tables[si + ':' + x.a] || '') + '</td><td>' + who(x.a, x.aFirst, x.winner === x.a) + '</td>' +
        '<td class="num">' + (x.aScore || '') + '</td><td class="num">' + (x.bScore || '') + '</td>' +
        '<td>' + who(x.b, x.bFirst, x.winner === x.b) + '</td><td>' + res + '</td></tr>';
    });
    rows.filter(function (x) { return x.b === null; }).forEach(function (x) {
      var label = x.nongame === null ? 'Needs an opponent' : nongameLabel(PM.game(s, x.a, r), 'results');
      h += '<tr><td></td><td>' + nm(s, x.a) + '</td><td colspan="4">' + label + '</td></tr>';
    });
    h += '</tbody></table><p>* = played first.' + (pending ? ' <b>' + pending + ' result' + (pending === 1 ? ' is' : 's are') + ' not entered yet.</b>' : '') + '</p>';
    if (st.printWithStandings) {
      h += '<h2 style="margin-top:16px">Standings after round ' + r + (PM.isRoundComplete(s, r) ? '' : ' (round not finished)') + '</h2>' + standingsTable(s, r);
    }
    return h;
  }
  function prizesPrint(s) {
    var ex = s.prizeExtras || {};
