        'sized for phones (1080 × 1350, at most 15 rows each). They are made on this computer; nothing is sent anywhere until you send them yourself. ' +
        'With a save folder, they go into its "Share images" folder; otherwise they are downloaded.</p>' : '<button id="pr-go" class="primary">Print…</button></div>') +
      '<details><summary class="hint">Tools</summary><p class="hint">Before sending the .TOU file to the ratings officer, remove table markers like @12, @R and (N) from names.</p>' +
      '<button id="pr-clean" class="small">Clean markers from all names</button></details></div>' +
      '<div class="preview" id="pr-preview">' + (sharing ? sharePreview() : buildPrint()) + '</div>';
    if (sharing) {
      $('sh-initials').onchange = function () { st.shareInitials = this.checked; render(); };
      $('sh-schools').onchange = function () { st.shareHideSchools = this.checked; render(); };
      $('sh-save').onclick = saveShareImages;
      if ($('sh-share')) $('sh-share').onclick = shareShareImages;
      $('sh-text').onclick = copyShareText;
    }
    $('pr-what').onchange = function () { st.printWhat = this.value; render(); };
    $('pr-secs').onchange = function () { st.printSecs = this.value; render(); };
    if ($('pr-round')) $('pr-round').onchange = function () { st.printRound = +this.value || null; render(); };
    $('main').querySelectorAll('[data-extra]').forEach(function (cb) {
      cb.onchange = function () { var ex = sec().prizeExtras = sec().prizeExtras || {}; if (this.checked) ex[this.dataset.extra] = true; else delete ex[this.dataset.extra]; changed(); };
    });
    ['from', 'to'].forEach(function (k) {
      if ($('pr-' + k)) $('pr-' + k).onchange = function () { var ex = sec().prizeExtras = sec().prizeExtras || {}, n = parseInt(this.value, 10); if (n > 0) ex[k] = n; else delete ex[k]; changed(); };
    });
    if ($('pr-places')) $('pr-places').onchange = function () { sec().prizes = Math.max(1, Math.min(50, parseInt(this.value, 10) || 3)); changed(); };
    if ($('pr-stand')) $('pr-stand').onchange = function () { st.printWithStandings = this.checked; render(); };
    if ($('pr-go')) $('pr-go').onclick = function () {
      $('print-area').innerHTML = buildPrint();
      var land = null;
      if (st.printWhat === 'wallchart') { land = document.createElement('style'); land.textContent = '@page { size: landscape; }'; document.head.appendChild(land); }
      window.print();
      if (land) land.remove();
    };
    $('pr-clean').onclick = function () {
      if (!confirm('Remove @12, @R and (N) markers from every player name? Fixed tables will no longer apply.')) return;
      PM.cleanMarkers(st.t); changed();
    };
  }

  // ---------- top bar ----------
  // ---------- practice mode (dry run) ----------
  function startPractice(fresh) {
    practice = true;
    if (fresh || !load()) { st.t = PM.sampleTournament(); st.sec = 0; st.round = 1; st.tab = 'players'; }
    st.t.title = st.t.title || 'Practice tournament';
    undoLog.reset(st.t); document.body.classList.add('practicing'); changed();
    flash('Practice started: try the Players, Rounds & scores, Standings and Print tabs');
  }
  function leavePractice() {
    practice = false; document.body.classList.remove('practicing');
    if (!load()) freshTournament();
    undoLog.reset(st.t); render(); renderUndo();
    flash('Back to your real tournament');
  }

  // ---------- projector scoreboard (a second window, read-only) ----------
  // Reads the autosave the main window writes, so it follows every score as it is entered. It never saves.
  function scoreboard(key) {
    document.title = 'PairMaster – Standings';
    document.body.className = 'board';
    document.body.innerHTML = '<div id="board"></div><button id="board-full" class="small">Full screen</button>';
    var page = 0, secIdx = 0, last = '';
    $('board-full').onclick = function () { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); this.hidden = true; };
    function read() {
      try { var d = JSON.parse(localStorage.getItem(key)); return d && PM.validTournament(d.t) ? d.t : null; } catch (e) { return null; }
    }
    function draw(advance) {
      var t = read(), box = $('board');
      if (!t) { box.innerHTML = '<h1>Waiting for PairMaster…</h1>'; return; }
      var secs = t.sections.filter(function (x) { return x.players.length; });
      if (!secs.length) { box.innerHTML = '<h1>' + esc(t.title) + '</h1><p>No players yet.</p>'; return; }
      var perPage = Math.max(5, Math.floor((window.innerHeight - 170) / 46));
      if (advance) {
        page++;
        var pages = Math.ceil(secs[secIdx % secs.length].players.length / perPage);
        if (page >= pages) { page = 0; secIdx = (secIdx + 1) % secs.length; }
      }
      var s = secs[secIdx % secs.length], done = PM.roundsComplete(s), key = t.rankMethod === 'A' ? 'total' : 'spread';
      var rows = PM.standings(t, s, done), pages2 = Math.ceil(rows.length / perPage);
      if (page >= pages2) page = 0;
      var h = '<h1>' + esc(t.title) + ' – Division ' + esc(s.name) + '</h1><h2>Standings after round ' + done +
        (pages2 > 1 ? ' · page ' + (page + 1) + ' of ' + pages2 : '') + ' · updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</h2>' +
        '<table><thead><tr><th class="num">#</th><th>Player</th><th class="num">Wins</th><th class="num">' + (key === 'total' ? 'Total' : 'Spread') + '</th></tr></thead><tbody>';
      rows.slice(page * perPage, (page + 1) * perPage).forEach(function (x) {
        h += '<tr><td class="num">' + x.rank + '</td><td>' + esc(PM.displayName(s.players[x.idx].name)) + '</td><td class="num">' + fmtWins(x.wins) +
          '</td><td class="num">' + (key === 'total' ? x.total : fmtSigned(x.spread)) + '</td></tr>';
      });
      box.innerHTML = h + '</tbody></table>';
    }
    draw(false);
    window.addEventListener('storage', function (e) { if (e.key === key && e.newValue !== last) { last = e.newValue; draw(false); } });
    setInterval(function () { draw(true); }, 15000); // next page or division every 15 s (also catches missed updates)
    window.addEventListener('resize', function () { draw(false); });
  }

  function init() {
    if (/^#scoreboard/.test(location.hash)) { scoreboard(location.hash === '#scoreboard-practice' ? STORE_KEY + '.practice' : STORE_KEY); return; }
    if (!load()) { freshTournament(); save(); }
    try { render(); } catch (e) {
      try { localStorage.setItem(STORE_KEY + '.damaged', localStorage.getItem(STORE_KEY)); } catch (e2) { /* ignore */ }
      alert('The autosaved tournament could not be shown, so a new one has been started. The damaged copy was kept. Open your latest .TOU file to carry on.');
      freshTournament(); undoLog.reset(st.t); save();
    }
    Array.prototype.forEach.call($('tabs').children, function (b) {
      b.onclick = function () { st.tab = b.dataset.tab; if (st.tab === 'round') st.round = defaultRound(sec()); changed(); };
    });
    $('btn-new').onclick = function () {
      if (!confirm(practice ? 'Start the practice event again?' : 'Start a new tournament? Save the current one first if you need it (Undo can also bring it back).')) return;
      if (practice) { startPractice(true); return; }
      freshTournament(); changed();
    };
    $('btn-save').onclick = function () {
      if (practice) { alert('Saving is turned off in practice, so nothing can be mixed up with a real tournament. Click "Leave practice" first.'); return; }
      saveTou();
    };
    $('btn-practice').onclick = function () {
      if (practice) { leavePractice(); return; }
      if (confirm('Open the practice tournament? It is a made-up event for trying things out; your real tournament is kept safe and comes back when you leave practice.')) startPractice(false);
    };
    $('btn-undo').onclick = undo;
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '') && $('r-find')) { e.preventDefault(); $('r-find').focus(); return; }
      // Ctrl+Z / Cmd+Z undoes a PairMaster change, except while typing in a box (where it undoes the typing).
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 'z' || e.key === 'Z') &&
          !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); undo(); }
    });
    // PairMaster.html is often shared on its own, without guide.html beside it. Opened from a file and online,
    // Help goes to the online guide; offline it opens the guide.html that came in the download.
    $('btn-help').onclick = function () {
      this.href = location.protocol === 'file:' && navigator.onLine ? ONLINE_GUIDE : 'guide.html';
    };
    $('btn-open').onclick = function () {
      if (practice) { alert('Opening files is turned off in practice. Click "Leave practice" first.'); return; }
      openTou();
    };
    $('btn-folder').onclick = chooseFolder;
    if (canFolder) idb('get').then(function (h) { folder = h; renderFolder(); });
    $('file-input').onchange = function () {
      var f = this.files[0]; if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { openFileText(f.name, reader.result); };
      reader.readAsText(f);
    };
    window.addEventListener('beforeprint', function () { if (!$('print-area').innerHTML) $('print-area').innerHTML = buildPrint(); });
    window.addEventListener('afterprint', function () { $('print-area').innerHTML = ''; });
    render();
  }
  if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', init);
})(PM);

</script>
</body>
